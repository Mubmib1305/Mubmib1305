<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <style>
      .row { opacity: 0; animation: in 0.4s forwards; }
      .r1{animation-delay:.2s}.r2{animation-delay:.5s}.r3{animation-delay:.8s}.r4{animation-delay:1.1s}.r5{animation-delay:1.4s}.r6{animation-delay:1.7s}
      .stamp { opacity: 0; transform-origin: 980px 150px; animation: stamp .35s 2.1s forwards cubic-bezier(.2,1.6,.4,1); }
      .bar { animation: pulse 2s infinite ease-in-out; transform-origin: left; }
      @keyframes in { from{opacity:0; transform:translateX(-12px)} to{opacity:1; transform:none} }
      @keyframes stamp { from{opacity:0; transform:rotate(-14deg) scale(2.2)} to{opacity:.9; transform:rotate(-14deg) scale(1)} }
      @keyframes pulse { 0%,100%{transform:scaleX(1)} 50%{transform:scaleX(.82)} }
    </style>
  </defs>
  <rect width="1200" height="300" rx="14" fill="#07080d"/>
  <rect x="1" y="1" width="1198" height="298" rx="14" fill="none" stroke="#00f0ff" stroke-opacity="0.35"/>
  <rect x="0" y="0" width="1200" height="42" rx="14" fill="#0f1220"/>
  <rect x="0" y="28" width="1200" height="14" fill="#0f1220"/>
  <circle cx="26" cy="21" r="6" fill="#ff1f3d"/><circle cx="46" cy="21" r="6" fill="#ffd400"/><circle cx="66" cy="21" r="6" fill="#9cff57"/>
  <text x="96" y="26" font-size="14" fill="#8b93a7">~/intel/subject_1305.dossier  [CLASSIFIED]</text>

  <g font-size="19">
    <g class="row r1"><text x="40" y="88" fill="#00f0ff">SUBJECT</text><text x="230" y="88" fill="#f4f6ff">Nontapat "Mubmib"</text></g>
    <g class="row r2"><text x="40" y="122" fill="#00f0ff">ROLE</text><text x="230" y="122" fill="#f4f6ff">CEO / Builder @ SUISUI TECH</text></g>
    <g class="row r3"><text x="40" y="156" fill="#00f0ff">OPERATION</text><text x="230" y="156" fill="#f4f6ff">CATAROT: AI tarot, catarot.love</text></g>
    <g class="row r4"><text x="40" y="190" fill="#00f0ff">WEAPONS</text><text x="230" y="190" fill="#f4f6ff">TypeScript  React  Node  Python  Firebase</text></g>
    <g class="row r5"><text x="40" y="224" fill="#00f0ff">MODUS</text><text x="230" y="224" fill="#f4f6ff">ships fast, breaks nothing (allegedly)</text></g>
    <g class="row r6"><text x="40" y="258" fill="#00f0ff">THREAT LVL</text>
      <rect x="230" y="242" width="300" height="18" rx="3" fill="#1b1f2e"/>
      <rect class="bar" x="230" y="242" width="282" height="18" rx="3" fill="#ff1f3d"/>
      <text x="548" y="258" fill="#ff1f3d">94% / EXTREME</text></g>
  </g>

  <g class="stamp">
    <rect x="850" y="105" width="270" height="92" rx="8" fill="none" stroke="#ff1f3d" stroke-width="5"/>
    <text x="985" y="148" text-anchor="middle" font-size="30" font-weight="900" fill="#ff1f3d" letter-spacing="4">WANTED</text>
    <text x="985" y="180" text-anchor="middle" font-size="15" fill="#ff1f3d" letter-spacing="3">FOR SHIPPING CODE</text>
  </g>
</svg>
